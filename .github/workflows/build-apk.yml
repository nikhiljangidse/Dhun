name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Dhun-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish APK to Releases (direct phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Dhun.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dhun.apk \
            --title "Dhun (latest build)" \
            --notes "Built from commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
